<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ComicDBSQ - Explora y gestiona tu colección de cómics"
    />
    <title>ComicDBSQ - Tu base de datos de cómics para frikis</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a2e' width='192' height='192'/><text x='50%' y='50%' font-size='120' fill='white' text-anchor='middle' dominant-baseline='central'>📚</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"

                  <span class="nav-link-text">Inicio</span>

              </li>
              <li>

              </li>
              <li>

              </li>
              <li>
                <a href="#/history" class="nav-link">
                  <svg class="nav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></svg>
                  <span class="nav-link-text">Historial</span>
                </a>
              </li>
              <li>
                <a href="#/contact" class="nav-link">

            <div class="nav-actions">
              <button id="install-app-btn" class="btn-install" type="button" hidden>
                <svg class="btn-install-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M4 19h16" /></svg>
                <span class="btn-install-text">Instalar app</span>
              </button>
              <button class="menu-toggle" aria-label="Alternar menú">
                <span></span>
                <span></span>
                <span></span>
              </button>
